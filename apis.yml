aid: m0
name: M0
description: >-
  M0 is modular stablecoin infrastructure that lets organizations launch and
  manage their own custom stablecoins instead of adopting a one-size-fits-all
  token. Its stack has three independent layers: an application layer for token
  behavior, rewards, and access controls; a distribution layer for cross-chain
  liquidity routing; and an issuance layer where teams pick an issuer or become
  their own. M0 is backed by U.S. Treasury Bill collateral held in special
  purpose vehicles, and exposes an Orchestration REST API (quotes, cross-chain
  orders, EIP-2612 permits) plus a Protocol GraphQL API for on-chain data, along
  with an MCP server and agent skills for AI builders. Used by MetaMask, PayPal,
  Anchorage, MoonPay, and others.
